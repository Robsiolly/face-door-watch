<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: Set the document title to the name of your application -->
  <title>OTREBOR</title>
  <meta name="description" content="Sistema de Portaria com Reconhecimento Facial">
  <meta name="author" content="Robsiolly" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">

  <meta property="og:type" content="website" />
  <meta property="og:title" content="OTREBOR • Biometric Security Protocol">
  <meta property="og:description" content="Quantum-grade biometric identity management and security ecosystem.">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:url" content="https://otrebor.vercel.app">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OTREBOR • Biometric Security Protocol">
  <meta name="twitter:description" content="Quantum-grade biometric identity management and security ecosystem.">
  <meta name="twitter:image" content="/og-image.png">

  <script>
    // Global error handling for better mobile debugging
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      console.error('Global error:', msg, 'at', url, ':', lineNo);
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="padding: 20px; color: white; background: #991b1b; font-family: sans-serif;">' +
          '<h3>Erro ao Carregar o App</h3>' +
          '<p>' + msg + '</p>' +
          '<p><small>' + url + ' L' + lineNo + '</small></p>' +
          '<button onclick="location.reload()" style="padding: 10px; margin-top: 10px;">Recarregar</button>' +
          '</div>';
      }
      return false;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('SW Registered!', reg);
          // Check for updates
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New content available; please refresh.');
                }
              };
            }
          };
        }).catch(err => {
          console.log('SW Registration failed', err);
        });
      });
    }

    // Detect "Black Screen" (if app doesn't render in 10s)
    setTimeout(() => {
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="padding: 20px; color: white; text-align: center; font-family: sans-serif;">' +
          '<p>Carregando...</p>' +
          '<p><small>Se a tela continuar preta, tente limpar o cache do navegador.</small></p>' +
          '<button onclick="location.reload()" style="background: #1a1a1a; color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 5px;">Recarregar App</button>' +
          '</div>';
      }
    }, 10000);
  </script>
</head>

<body>
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0a0a0a; color: white; font-family: sans-serif;">
      <div
        style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite;">
      </div>
      <p style="margin-top: 15px; opacity: 0.8;">OTREBOR</p>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
